<main>
  <article>
    <h1>Contact me</h1>
    <p>Send me your questions, or anything. All fields are required.</p>

    <form action="mailto:your.email@example.com?subject=Portfolio%20message" method="post" enctype="text/plain" name="contact">
      <div class="form-box">
        <p>
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="First and last name" required>
        </p>
        <p>
          <label for="email">Your email</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </p>
        <p>
          <!-- pattern checks for 10 digits, e.g. 905-555-0123 -->
          <label for="phone">Cell number</label>
          <input type="tel" id="phone" name="phone" placeholder="905-555-0123" pattern="[0-9]{3}-?[0-9]{3}-?[0-9]{4}" title="10 digits, for example 905-555-0123" required>
        </p>
        <p>
          <label for="comments">Comments</label>
          <textarea id="comments" name="comments" rows="6" cols="40" maxlength="500" placeholder="Question, comment or query" required></textarea>
        </p>
        <p>
          <input type="checkbox" id="robot" name="robot" required>
          <label for="robot">I am not a robot</label>
        </p>
      </div>

      <p class="buttons">
        <input type="submit" value="Send message">
        <input type="reset" value="Clear form">
      </p>
    </form>
  </article>
</main>

<footer>
